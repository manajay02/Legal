<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexVision AI - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #1a3a5c;
      --primary-light: #2a5080;
      --accent:        #e67e22;
      --accent-light:  #f39c12;
      --bg:            #eef1f7;
      --card-bg:       #ffffff;
      --text:          #1e2d3d;
      --muted:         #6b7c93;
      --border:        #d8e1ec;
      --success:       #2e7d32;
      --danger:        #c62828;
      --info:          #1e88e5;
      --info-light:    #e3f2fd;
      --radius:        10px;
      --radius-sm:     6px;
      --shadow:        0 1px 3px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.07);
      --shadow-md:     0 4px 24px rgba(0,0,0,.12);
      --sidebar-bg:    #0f1e30;
      --transition:    .17s ease;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f1e30 0%, #1a3a5c 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      border-radius: 16px;
      background: rgba(30,136,229,.14);
      border: 2px solid rgba(30,136,229,.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .logo-icon svg {
      width: 36px;
      height: 36px;
      color: var(--info);
    }

    .logo-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .logo-subtitle {
      font-size: 0.9rem;
      color: #7fa3c4;
      margin-top: 0.3rem;
    }

    .auth-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 1rem;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }

    .auth-tab:hover {
      color: var(--primary);
      background: var(--info-light);
    }

    .auth-tab.active {
      color: var(--info);
    }

    .auth-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--info);
      border-radius: 3px 3px 0 0;
    }

    .auth-form-container {
      padding: 2rem;
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: #f8fafc;
      color: var(--text);
      transition: all var(--transition);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--info);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(30,136,229,.1);
    }

    .form-input::placeholder {
      color: var(--muted);
    }

    .submit-btn {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, var(--info) 0%, var(--primary-light) 100%);
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: all var(--transition);
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(30,136,229,.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-error {
      background: #fdecea;
      color: var(--danger);
      border: 1px solid #f5c6cb;
    }

    .alert-success {
      background: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .form-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--muted);
    }

    .form-footer a {
      color: var(--info);
      text-decoration: none;
      font-weight: 500;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
    }

    .password-toggle:hover {
      color: var(--text);
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .auth-form-container {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
          <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
          <path d="M7 21h10"/>
          <path d="M12 21V7"/>
          <path d="M3 7h2c2 0 4-2 7-2s5 2 7 2h2"/>
        </svg>
      </div>
      <h1 class="logo-title">LexVision</h1>
      <p class="logo-subtitle">Sri Lanka Judiciary AI</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="signup">Create Account</button>
      </div>

      <div class="auth-form-container">
        <div id="alert" class="alert"></div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form active">
          <div class="form-group">
            <label class="form-label" for="login-username">Username</label>
            <input type="text" id="login-username" class="form-input" placeholder="Enter your username" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" onclick="togglePassword('login-password')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="loginBtn">Sign In</button>

          <div class="form-footer">
            Don't have an account? <a href="#" onclick="switchTab('signup')">Create one</a>
          </div>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="auth-form">
          <div class="form-group">
            <label class="form-label" for="signup-username">Username</label>
            <input type="text" id="signup-username" class="form-input" placeholder="Choose a username" required minlength="3">
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-email">Email</label>
            <input type="email" id="signup-email" class="form-input" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="signup-password" class="form-input" placeholder="Create a password (min 6 characters)" required minlength="6">
              <button type="button" class="password-toggle" onclick="togglePassword('signup-password')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="signupBtn">Create Account</button>

          <div class="form-footer">
            Already have an account? <a href="#" onclick="switchTab('login')">Sign in</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/extractor/api/v1';

    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    function switchTab(tabName) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
      document.getElementById(`${tabName}Form`).classList.add('active');
      hideAlert();
    }

    // Alert handling
    function showAlert(message, type = 'error') {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert show alert-${type}`;
    }

    function hideAlert() {
      document.getElementById('alert').classList.remove('show');
    }

    // Password toggle
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Set button loading state
    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Please wait...';
      } else {
        btn.disabled = false;
        btn.textContent = btnId === 'loginBtn' ? 'Sign In' : 'Create Account';
      }
    }

    // Login form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      setLoading('loginBtn', true);

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'include'
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Login successful! Redirecting...', 'success');
          localStorage.setItem('loggedInUser', data.username);
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        } else {
          showAlert(data.detail || 'Invalid username or password');
        }
      } catch (error) {
        showAlert('Connection error. Please try again.');
      } finally {
        setLoading('loginBtn', false);
      }
    });

    // Signup form submission
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      setLoading('signupBtn', true);

      const username = document.getElementById('signup-username').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;

      try {
        const response = await fetch(`${API_BASE}/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
          credentials: 'include'
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Account created! Redirecting...', 'success');
          localStorage.setItem('loggedInUser', data.username);
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        } else {
          showAlert(data.detail || 'Failed to create account');
        }
      } catch (error) {
        showAlert('Connection error. Please try again.');
      } finally {
        setLoading('signupBtn', false);
      }
    });

    // Check if already logged in
    async function checkAuth() {
      try {
        const response = await fetch(`${API_BASE}/auth/check`, {
          credentials: 'include'
        });
        const data = await response.json();
        if (data.success) {
          window.location.href = '/';
        }
      } catch (error) {
        // Not logged in, stay on login page
      }
    }

    checkAuth();
  </script>
</body>
</html>
