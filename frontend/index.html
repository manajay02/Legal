<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Argument Strength scorer</title>
    <link rel="stylesheet" href="css/style.css?v=20260418_1">
</head>
<body>
    <div class="container">
        <!--  Header -->
        <header class="header">
            <h1>Legal Argument Strength scorer</h1>
            <p class="subtitle">AI-Powered Legal Argument Analysis & scoring for Sri Lankan Civil Cases</p>
            <div id="apiStatus" class="api-status"></div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tabs" style="display: none;">
            <button class="tab active" data-tab="text">
                Analyze Text
            </button>
        </nav>

        <!-- Text Analysis Tab -->
        <section id="textTab" class="tab-content active">
            <div class="input-section">
                <label for="argumentText" class="input-label">
                    Enter Legal Argument (50-10,000 characters)
                </label>
                <textarea 
                    id="argumentText" 
                    class="text-input"
                    rows="12" 
                    placeholder="Paste your legal argument here..."></textarea>
                <div class="char-count" id="charCount">0 / 10,000 characters</div>
            </div>

            <div class="input-section">
                <label class="input-label">Upload Supporting Document (PDF/TXT)</label>

                <input
                    id="supportFileInput"
                    type="file"
                    accept=".pdf,.txt"
                    style="display:none;"
                />

                <div id="supportUploadArea" class="file-upload-area">
                    <p><strong>Click to select</strong> or drag & drop</p>
                    <p class="small">These documents are used as evidence for citations.</p>
                </div>

                <button class="btn-primary" id="supportUploadBtn" disabled>
                    Upload Supporting Document
                </button>

                <div id="supportDocsList"></div>
            </div>
            
            <button class="btn-primary" id="analyzeBtn">
                Analyze Argument
            </button>
            
            <div id="textResults"></div>
        </section>
    </div>

    <script src="js/config.js?v=20260418_1"></script>
    <script src="js/api.js?v=20260418_1"></script>
    <script src="js/ui.js?v=20260418_1"></script>
    <script src="js/app.js?v=20260418_1"></script>
</body>
</html>
